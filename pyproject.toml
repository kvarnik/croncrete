[project]
name = "croncrete"
version = "0.1.0"
description = "Agents prototype. Croncrete compiles the workflow into Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "rich==15.0.0",
    "typer==0.27.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.scripts]
croncrete = "croncrete.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/croncrete"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
